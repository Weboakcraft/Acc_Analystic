<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accounts Dashboard - Tally-integrated accounting, receivables, payables, GST and MIS">
  <meta name="referrer" content="no-referrer">
  <title>Accounts Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5fcf'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='700' font-size='17' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
/* Accounts Dashboard - enterprise finance UI
   Tokens first; every component reads tokens so light/dark swap in one place. */
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --surface-3: #eef0f4;
  --border: #e3e6ec;
  --border-strong: #cfd4dd;
  --text: #0f172a;
  --text-2: #475467;
  --muted: #6b7280;
  --accent: #1f5fcf;
  --accent-ink: #ffffff;
  --accent-soft: #e8effc;
  --sidebar: #111827;
  --sidebar-2: #1b2334;
  --sidebar-text: #c9d1e0;
  --sidebar-muted: #7b879c;
  --pos: #0a7a3d;
  --neg: #c0342f;
  --warn: #9a6200;
  --pos-soft: #e7f5ec;
  --neg-soft: #fdecec;
  --warn-soft: #fff4dc;
  --info-soft: #e8effc;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .16);
  --radius: 10px;
  --radius-sm: 6px;
  /* chart roles (validated reference palette) */
  --chart-surface: #ffffff;
  --grid: #e1e0d9;
  --axis: #898781;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --seq-1: #b7d3f6; --seq-2: #86b6ef; --seq-3: #5598e7; --seq-4: #2a78d6; --seq-5: #1c5cab; --seq-6: #104281; --seq-7: #0d366b;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1014; --surface: #161a21; --surface-2: #1b2029; --surface-3: #232a35;
    --border: #2a313d; --border-strong: #3a4353; --text: #eef1f6; --text-2: #b4bdcc; --muted: #8b95a7;
    --accent: #5b9bf0; --accent-ink: #0b1220; --accent-soft: #1a2a45;
    --sidebar: #0b0d12; --sidebar-2: #151a24;
    --pos: #3ccf7a; --neg: #f07b72; --warn: #f2b84b;
    --pos-soft: #12301f; --neg-soft: #3a1917; --warn-soft: #3a2c10; --info-soft: #1a2a45;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
    --chart-surface: #161a21; --grid: #2c2c2a; --axis: #898781;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --seq-1: #0d366b; --seq-2: #104281; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1014; --surface: #161a21; --surface-2: #1b2029; --surface-3: #232a35;
  --border: #2a313d; --border-strong: #3a4353; --text: #eef1f6; --text-2: #b4bdcc; --muted: #8b95a7;
  --accent: #5b9bf0; --accent-ink: #0b1220; --accent-soft: #1a2a45;
  --sidebar: #0b0d12; --sidebar-2: #151a24;
  --pos: #3ccf7a; --neg: #f07b72; --warn: #f2b84b;
  --pos-soft: #12301f; --neg-soft: #3a1917; --warn-soft: #3a2c10; --info-soft: #1a2a45;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
  --chart-surface: #161a21; --grid: #2c2c2a; --axis: #898781;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --seq-1: #0d366b; --seq-2: #104281; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #9ec5f4;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a[role="button"] { color: var(--accent); cursor: pointer; }
a[role="button"]:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar { background: var(--sidebar); color: var(--sidebar-text); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #2a78d6, #1c5cab); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; }
.brand-name { font-weight: 600; color: #fff; font-size: 15px; }
.brand-sub { font-size: 11px; color: var(--sidebar-muted); }
.nav { padding: 8px 10px 24px; flex: 1; }
.nav-group { margin-top: 14px; }
.nav-group-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--sidebar-muted); padding: 0 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: var(--sidebar-text); font-size: 13.5px; text-decoration: none; }
.nav a:hover { background: var(--sidebar-2); color: #fff; }
.nav a.active { background: #22314d; color: #fff; }
.nav a svg { width: 16px; height: 16px; flex: none; opacity: .85; }
.nav .badge-count { margin-left: auto; background: #c0342f; color: #fff; border-radius: 10px; font-size: 11px; padding: 0 6px; }
.sidebar-foot { padding: 12px 18px; border-top: 1px solid rgba(255,255,255,.06); font-size: 11px; color: var(--sidebar-muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 10px 24px; }
.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; }
.search input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); outline: none; }
.search input:focus { border-color: var(--accent); background: var(--surface); }
.search svg { position: absolute; left: 10px; top: 9px; width: 16px; height: 16px; color: var(--muted); }
.search kbd { position: absolute; right: 8px; top: 7px; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; background: var(--surface); }
.search-results { position: absolute; top: 42px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); max-height: 420px; overflow: auto; z-index: 40; }
.search-results .item { display: flex; gap: 10px; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
.search-results .item:hover, .search-results .item.sel { background: var(--surface-2); }
.search-results .kind { font-size: 11px; text-transform: uppercase; color: var(--muted); width: 64px; flex: none; padding-top: 2px; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.ok .dot { background: #0ca30c; } .pill.warn .dot { background: #fab219; } .pill.bad .dot { background: #d03b3b; }
.pill.demo { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--text-2); position: relative; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn .dotn { position: absolute; top: -4px; right: -4px; min-width: 17px; height: 17px; border-radius: 9px; background: #c0342f; color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }
.user { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 3px 6px; border-radius: 8px; position: relative; }
.user:hover { background: var(--surface-2); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.user-meta { line-height: 1.2; } .user-meta b { font-size: 13px; font-weight: 600; } .user-meta span { display: block; font-size: 11px; color: var(--muted); }
.menu { position: absolute; right: 0; top: 42px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); min-width: 220px; padding: 6px; z-index: 50; }
.menu button, .menu a { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: 0; background: none; cursor: pointer; color: var(--text); }
.menu button:hover { background: var(--surface-2); }

.content { padding: 22px 24px 48px; max-width: 1480px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 21px; }
.page-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--neg); border-color: var(--neg); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn svg { width: 15px; height: 15px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--text-2); font-weight: 500; }
.field .hint { font-size: 11.5px; color: var(--muted); }
.input, select.input, textarea.input { padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); outline: none; min-width: 0; width: 100%; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.num { text-align: right; }
.filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 14px; }
.filters .field { min-width: 140px; }
.filters .field.grow { flex: 1; min-width: 180px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 11px; cursor: pointer; font-size: 12.5px; color: var(--text-2); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }

/* ---------- Cards & KPIs ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.card-head h3 { font-size: 14px; }
.card-head .sub { font-size: 12px; color: var(--muted); }
.card-body { padding: 14px 16px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.mt { margin-top: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.kpi .label { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: 21px; font-weight: 600; margin-top: 4px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .foot { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.accent { border-left: 3px solid var(--accent); }
.kpi.bad .value { color: var(--neg); }
.kpi.good .value { color: var(--pos); }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
.stat-line { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
.stat-line:last-child { border-bottom: 0; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-weight: 600; font-size: 12px; color: var(--text-2); background: var(--surface-2); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; }
table.data th.sortable { cursor: pointer; user-select: none; }
table.data th .arrow { opacity: .5; font-size: 10px; }
table.data td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.data tbody tr:hover { background: var(--surface-2); }
table.data tr.clickable { cursor: pointer; }
table.data tfoot td { font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--border-strong); }
table.data tr.group-row td { background: var(--surface-3); font-weight: 600; }
table.data tr.total-row td { font-weight: 600; border-top: 1px solid var(--border-strong); }
table.data tr.strong-row td { font-weight: 700; background: var(--surface-2); }
table.data td.indent { padding-left: 28px; }
.table-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.pager { display: flex; gap: 4px; align-items: center; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--surface-3); color: var(--text-2); }
.badge.good { background: var(--pos-soft); color: var(--pos); }
.badge.bad { background: var(--neg-soft); color: var(--neg); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.info { background: var(--info-soft); color: var(--accent); }
.badge svg { width: 12px; height: 12px; }

/* ---------- Charts ---------- */
.chart-box { position: relative; height: 260px; }
.chart-box.tall { height: 320px; }
.chart-box.short { height: 200px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ---------- Statements ---------- */
.statement td:first-child { width: 60%; }
.bs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.check { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 8px; font-weight: 500; }
.check.ok { background: var(--pos-soft); color: var(--pos); }
.check.bad { background: var(--neg-soft); color: var(--neg); }
.check svg { width: 18px; height: 18px; }
.formula { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; color: var(--text-2); }
.note { font-size: 12.5px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); border-radius: 6px; padding: 9px 12px; }

/* ---------- Alerts ---------- */
.alert-item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: flex-start; }
.alert-item:last-child { border-bottom: 0; }
.sev { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.sev svg { width: 15px; height: 15px; }
.sev.CRITICAL { background: var(--neg-soft); color: var(--neg); }
.sev.WARNING { background: var(--warn-soft); color: var(--warn); }
.sev.INFO { background: var(--info-soft); color: var(--accent); }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); width: 100%; max-width: 640px; }
.modal.wide { max-width: 980px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 16px; }
.modal-body { padding: 16px 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 12px 12px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100%); background: var(--bg); z-index: 61; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.drawer-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
.errors { background: var(--neg-soft); color: var(--neg); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
.errors ul { margin: 4px 0 0 18px; padding: 0; }
.toasts { position: fixed; bottom: 18px; right: 18px; z-index: 80; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--text); color: var(--surface); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow-lg); font-size: 13px; max-width: 380px; }
.toast.bad { background: var(--neg); color: #fff; }
.toast.good { background: #0a7a3d; color: #fff; }
.loading { padding: 40px; text-align: center; color: var(--muted); }
.spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.items-table input { width: 100%; }
.items-table select { min-width: 78px; }
.items-table input[name="qty"], .items-table input[name="discount_pct"] { min-width: 70px; }
.items-table input[name="rate"] { min-width: 100px; }
.items-table td { padding: 4px 6px; }
.totals-box { margin-left: auto; width: min(340px, 100%); }
.totals-box .stat-line b { font-variant-numeric: tabular-nums; }

/* ---------- Login ---------- */
.login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.login-art { background: var(--sidebar); color: #dfe6f2; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; }
.login-art h2 { font-size: 30px; color: #fff; max-width: 460px; line-height: 1.2; margin: 18px 0 12px; }
.login-art p { color: #9aa6ba; max-width: 460px; }
.login-art ul { color: #b9c3d4; padding-left: 18px; line-height: 1.9; }
.login-form { display: grid; place-items: center; padding: 32px 16px; }
.login-card { width: min(380px, 100%); }
.login-card h1 { font-size: 22px; margin-bottom: 4px; }
.login-card .field { margin-top: 12px; }
.role-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.role-pick button { text-align: left; padding: 9px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 12.5px; }
.role-pick button:hover { border-color: var(--accent); background: var(--accent-soft); }
.role-pick b { display: block; font-size: 13px; }

/* ---------- Print ---------- */
.print-head { display: none; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; color: #000; font-size: 11px; }
  .sidebar, .topbar, .filters, .actions, .tabs, .table-foot .pager, .no-print, .toasts { display: none !important; }
  .app { display: block; }
  .content { padding: 0; max-width: none; }
  .card, .kpi { box-shadow: none; border-color: #bbb; break-inside: avoid; }
  .print-head { display: block; border-bottom: 2px solid #000; margin-bottom: 10px; padding-bottom: 6px; }
  .print-head b { font-size: 15px; }
  table.data th { background: #eee !important; color: #000; position: static; }
  table.data td, table.data th { padding: 4px 6px; border-color: #ccc; }
  .drawer { position: static; box-shadow: none; width: 100%; }
  .overlay { position: static; background: none; padding: 0; }
  a { color: #000; }
}

/* ---------- Responsive ---------- */
.search { min-width: 160px; }
@media (max-width: 1100px) { .search kbd, .user-meta { display: none; } }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-2-1 { grid-template-columns: 1fr; } .g3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; z-index: 70; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: none; box-shadow: var(--shadow-lg); }
  .menu-btn { display: grid; }
  .topbar { padding: 10px 16px; }
  .content { padding: 16px; }
  .g2, .g3, .g4, .bs-grid, .form-grid, .form-grid.g3 { grid-template-columns: 1fr; }
  .user-meta, .search kbd, #syncPill { display: none; }
  .login-wrap { grid-template-columns: 1fr; }
  .login-art { display: none; }
}
@media (max-width: 520px) { .kpis { grid-template-columns: 1fr 1fr; } .kpi .value { font-size: 17px; } .page-head h1 { font-size: 18px; } }

</style>

  // ---------------------------------------------------------------------------

  // ---------------------------------------------------------------------------

  // ---------------------------------------------------------------------------

      from: from, to: to,
      lines: [
        { code: 'REVENUE', label: 'Revenue from operations (Sales)', amount: revenue, detail: buckets.revenue },
        { code: 'DIRECT_INCOME', label: 'Direct incomes', amount: directIncome, detail: buckets.directIncome },
        { code: 'OPENING_STOCK', label: 'Opening stock', amount: openingStock, detail: [] },
        { code: 'PURCHASES', label: 'Purchases', amount: purchases, detail: buckets.purchases },
        { code: 'DIRECT_EXPENSES', label: 'Direct expenses', amount: directExp, detail: buckets.directExpenses },
        { code: 'CLOSING_STOCK', label: 'Less: Closing stock', amount: closingStock, detail: [] },
        { code: 'COGS', label: 'Cost of goods sold', amount: cogs, total: true },
        { code: 'GROSS_PROFIT', label: 'Gross profit', amount: grossProfit, total: true, strong: true },
        { code: 'OPERATING_EXPENSES', label: 'Operating (indirect) expenses', amount: operating, detail: buckets.operating },
        { code: 'OTHER_INCOME', label: 'Other income', amount: otherIncome, detail: buckets.otherIncome },
        { code: 'EBITDA', label: 'EBITDA', amount: ebitda, total: true, strong: true },
        { code: 'DEPRECIATION', label: 'Depreciation', amount: dep, detail: buckets.depreciation },
        { code: 'INTEREST', label: 'Interest / finance cost', amount: interest, detail: buckets.interest },
        { code: 'PBT', label: 'Profit before tax', amount: pbt, total: true, strong: true },
        { code: 'TAX', label: 'Income tax', amount: tax, detail: buckets.tax },
        { code: 'NET_PROFIT', label: 'Net profit', amount: net, total: true, strong: true }
      ],
      revenue: revenue, cogs: cogs, grossProfit: grossProfit, operating: operating, otherIncome: otherIncome,
      ebitda: ebitda, depreciation: dep, interest: interest, pbt: pbt, tax: tax, netProfit: net,
      openingStock: openingStock, closingStock: closingStock, purchases: purchases, directExpenses: directExp,
      grossMargin: pct(grossProfit, revenue), netMargin: pct(net, revenue),
      notes: [
        'Closing stock source: ' + ctx.S.STOCK_VALUATION_SOURCE + ' (setting STOCK_VALUATION_SOURCE).',
        'Depreciation, interest and income-tax lines are identified by LEDGERS.mis_category.',
        ctx.S.EBITDA_INCLUDES_OTHER_INCOME ? 'EBITDA includes other income.' : 'EBITDA excludes other income (added back before PBT).'
      ]
    };
  }

  /** P&L for current/previous month, current/previous FY and YTD in one call. */
  function profitLossComparative(ctx, p) {
    var asOf = D(p && p.asOf) || ctx.today;
    var fs = fyStart(asOf, ctx.fyM);
    var pm = periodRange('previous_month', asOf, ctx.fyM);
    var pfy = periodRange('previous_fy', asOf, ctx.fyM);
    var sameDayLastYear = addDays(asOf, -365);
    function pick(r) { return { revenue: r.revenue, grossProfit: r.grossProfit, operating: r.operating, ebitda: r.ebitda, pbt: r.pbt, netProfit: r.netProfit, grossMargin: r.grossMargin, netMargin: r.netMargin }; }
    return {
      asOf: asOf,
      currentMonth: pick(profitLoss(ctx, { from: asOf.slice(0, 8) + '01', to: asOf })),
      previousMonth: pick(profitLoss(ctx, pm)),
      ytd: pick(profitLoss(ctx, { from: fs, to: asOf })),
      previousYtd: pick(profitLoss(ctx, { from: fyStart(sameDayLastYear, ctx.fyM), to: sameDayLastYear })),
      previousFy: pick(profitLoss(ctx, pfy)),
      trend: monthlyTrend(ctx, { from: fs, to: asOf })
    };
  }

  function monthlyTrend(ctx, p) {
    var to = D(p.to) || ctx.today, from = D(p.from) || fyStart(to, ctx.fyM);
    var out = [], m = from.slice(0, 8) + '01';
    while (m <= to) {
      var e = endOfMonth(m); if (e > to) e = to;
      var s = m < from ? from : m;
      var pl = profitLoss(ctx, { from: s, to: e });
      out.push({ month: m.slice(0, 7), revenue: pl.revenue, grossProfit: pl.grossProfit, operating: pl.operating, netProfit: pl.netProfit });
      m = addDays(endOfMonth(m), 1);
    }
    return out;
  }

  // ---------------------------------------------------------------------------
  // Balance sheet
  // ---------------------------------------------------------------------------
  function balanceSheet(ctx, p) {
    p = p || {};
    var asOf = D(p.asOf || p.to) || ctx.today;
    var fs = fyStart(asOf, ctx.fyM);
    var sections = {}, openingSum = 0, plBeforeFy = 0, plCurrent = 0;
    ledgerNames(ctx).forEach(function (name) {
      var info = ctx.ledgerInfo(name);
      openingSum += info.openingNd;
      if (info.isPL) {
        plBeforeFy += info.openingNd;
        (ctx.byLedger[key(name)] || []).forEach(function (l) {
          if (l.date > asOf) return;
          if (l.date < fs) plBeforeFy += l.nd; else plCurrent += l.nd;
        });
        return;
      }
      if (info.isStock) return; // replaced by closing-stock valuation
      var bal = balanceAt(ctx, name, asOf);
      if (!bal) return;
      var side = info.nature === 'Assets' ? 'Assets' : 'Liabilities';
      var sectionName = info.primary;
      var sub = info.chain.length > 1 ? info.chain[info.chain.length - 2] : info.primary;
      var s = sections[side + '|' + sectionName] = sections[side + '|' + sectionName] || { side: side, section: sectionName, subgroups: {} };
      var g = s.subgroups[sub] = s.subgroups[sub] || { name: sub, amount: 0, ledgers: [] };
      var amt = side === 'Assets' ? bal : -bal;
      g.amount = r2(g.amount + amt);
      g.ledgers.push({ ledger: name, amount: amt });
    });
    // Stock: valuation replaces stock ledgers; the difference flows through retained / current profit.
    var stockLedgerBal = stockLedgerBalance(ctx, asOf);
    var stockFy = stockAt(ctx, addDays(fs, -1)), stockClose = stockAt(ctx, asOf);
    if (stockClose) {
      var ca = sections['Assets|Current Assets'] = sections['Assets|Current Assets'] || { side: 'Assets', section: 'Current Assets', subgroups: {} };
      ca.subgroups['Closing Stock'] = { name: 'Closing Stock', amount: stockClose, ledgers: [{ ledger: 'Closing stock (valuation)', amount: stockClose }] };
    }
    var retained = r2(-plBeforeFy + (stockFy - stockLedgerBal));
    var currentProfit = r2(-plCurrent + (stockClose - stockFy));
    var eq = sections['Liabilities|Capital Account'] = sections['Liabilities|Capital Account'] || { side: 'Liabilities', section: 'Capital Account', subgroups: {} };
    if (retained) eq.subgroups['Retained earnings (P&L b/f)'] = { name: 'Retained earnings (P&L b/f)', amount: retained, ledgers: [] };
    eq.subgroups['Profit for the period'] = { name: 'Profit for the period (' + fyLabel(asOf, ctx.fyM) + ')', amount: currentProfit, ledgers: [] };
    openingSum = r2(openingSum);
    if (Math.abs(openingSum) >= ctx.S.BALANCE_TOLERANCE) {
      sections['Liabilities|Difference in opening balances'] = { side: 'Liabilities', section: 'Difference in opening balances', subgroups: { 'Difference': { name: 'Difference in opening balances', amount: openingSum, ledgers: [] } } };
    }
    var list = Object.keys(sections).map(function (k) {
      var s = sections[k];
      var subs = Object.keys(s.subgroups).map(function (n) { return s.subgroups[n]; });
      return { side: s.side, section: s.section, amount: sum(subs, function (g) { return g.amount; }), groups: subs };
    });
    var order = ['Capital Account', 'Loans (Liability)', 'Current Liabilities', 'Suspense A/c', 'Branch / Divisions', 'Difference in opening balances', 'Fixed Assets', 'Investments', 'Current Assets', 'Misc. Expenses (ASSET)'];
    list = sortBy(list, function (s) { var i = order.indexOf(s.section); return i < 0 ? 99 : i; });
    var assets = list.filter(function (s) { return s.side === 'Assets'; });
    var liabilities = list.filter(function (s) { return s.side === 'Liabilities'; });
    var totalAssets = sum(assets, function (s) { return s.amount; });
    var totalLiab = sum(liabilities, function (s) { return s.amount; });
    return {
      asOf: asOf, assets: assets, liabilities: liabilities,
      totalAssets: totalAssets, totalLiabilities: totalLiab,
      difference: r2(totalAssets - totalLiab),
      balanced: Math.abs(totalAssets - totalLiab) < ctx.S.BALANCE_TOLERANCE,
      equity: eq ? sum(Object.keys(eq.subgroups).map(function (k) { return eq.subgroups[k]; }), function (g) { return g.amount; }) : 0,
      currentProfit: currentProfit, retainedEarnings: retained, closingStock: stockClose
    };
  }

  // ---------------------------------------------------------------------------
  // Cash flow (direct method, derived from cash/bank postings)
  // ---------------------------------------------------------------------------
  function classifyCashLine(ctx, info) {
    var c = info.chain;
    function has(g) { return c.indexOf(g) >= 0; }
    if (info.isDebtor) return ['Operating', 'Receipts from customers', 'Refunds to customers'];
    if (info.isCreditor) return ['Operating', 'Refunds from suppliers', 'Payments to suppliers'];
    if (has('Duties & Taxes')) return ['Operating', 'Tax refunds', 'GST / TDS paid'];
    if (info.isPL) {
      if (info.mis === 'INTEREST') return [ctx.S.INTEREST_PAID_ACTIVITY === 'Operating' ? 'Operating' : 'Financing', 'Interest received', 'Interest paid'];
      if (info.mis === 'INCOME_TAX') return ['Operating', 'Income tax refund', 'Income tax paid'];
      if (info.mis === 'SALARY') return ['Operating', 'Salary recoveries', 'Payments to employees'];
      if (info.nature === 'Income') return ['Operating', info.primary === 'Sales Accounts' ? 'Cash sales' : 'Other income received', 'Income reversed'];
      return ['Operating', 'Expense refunds', 'Operating expenses paid'];
    }
    if (has('Fixed Assets')) return ['Investing', 'Sale of fixed assets', 'Purchase of fixed assets'];
    if (has('Investments')) return ['Investing', 'Sale of investments', 'Purchase of investments'];
    if (has('Loans & Advances (Asset)')) return ['Investing', 'Loans & advances recovered', 'Loans & advances given'];
    if (has('Capital Account')) return ['Financing', 'Capital introduced', 'Drawings / distributions'];
    if (has('Loans (Liability)')) return ['Financing', 'Borrowings raised', 'Borrowings repaid'];
    if (has('Suspense A/c')) return ['Operating', 'Unclassified receipts (Suspense)', 'Unclassified payments (Suspense)'];
    return ['Operating', 'Other operating receipts', 'Other operating payments'];
  }

  function cashFlow(ctx, p) {
    p = p || {};
    var to = D(p.to) || ctx.today, from = D(p.from) || fyStart(to, ctx.fyM);
    var isCash = function (i) { return i.isCashEq; };
    var opening = sumBalances(ctx, isCash, addDays(from, -1));
    var closing = sumBalances(ctx, isCash, to);
    var agg = {};
    ctx.vouchers.forEach(function (v) {
      if (!inRange(v.date, from, to)) return;
      var cashNd = sum(v.lines.filter(function (l) { return l.info.isCashEq; }), function (l) { return l.nd; });
      if (!cashNd) return;
      var counter = v.lines.filter(function (l) { return !l.info.isCashEq && (cashNd > 0 ? l.nd < 0 : l.nd > 0); });
      var totalOpp = sum(counter, function (l) { return -l.nd; });
      if (!totalOpp) return;
      counter.forEach(function (l) {
        var share = r2(cashNd * (-l.nd) / totalOpp);
        var cls = classifyCashLine(ctx, l.info);
        var label = share > 0 ? cls[1] : cls[2];
        var k = cls[0] + '|' + label;
        var a = agg[k] = agg[k] || { activity: cls[0], label: label, inflow: 0, outflow: 0 };
        if (share > 0) a.inflow = r2(a.inflow + share); else a.outflow = r2(a.outflow - share);
      });
    });
    var sections = ['Operating', 'Investing', 'Financing'].map(function (act) {
      var ls = Object.keys(agg).map(function (k) { return agg[k]; }).filter(function (a) { return a.activity === act; })
        .map(function (a) { a.net = r2(a.inflow - a.outflow); return a; });
      ls = sortBy(ls, function (a) { return -Math.abs(a.net); });
      return { activity: act, lines: ls, inflow: sum(ls, function (a) { return a.inflow; }), outflow: sum(ls, function (a) { return a.outflow; }), net: sum(ls, function (a) { return a.net; }) };
    });
    var net = sum(sections, function (s) { return s.net; });
    return {
      from: from, to: to, method: 'Direct', opening: opening, sections: sections,
      inflow: sum(sections, function (s) { return s.inflow; }), outflow: sum(sections, function (s) { return s.outflow; }),
      net: net, closing: closing, reconciles: Math.abs(opening + net - closing) < 1,
      difference: r2(opening + net - closing)
    };
  }

  // ---------------------------------------------------------------------------
  // Bill-wise outstanding, receivables, payables, ageing
  // ---------------------------------------------------------------------------
  function bucketFor(ctx, days) {
    var bounds = String(ctx.S.AGEING_BUCKETS).split(',').map(function (x) { return num(x); }).filter(Boolean);
    if (days < 0) return 'Not Due';
    var lo = 0;
    for (var i = 0; i < bounds.length; i++) {
      if (days <= bounds[i]) return (lo === 0 ? 0 : lo + 1) + '-' + bounds[i];
      lo = bounds[i];
    }
    return lo + '+';
  }
  function bucketLabels(ctx) {
    var bounds = String(ctx.S.AGEING_BUCKETS).split(',').map(function (x) { return num(x); }).filter(Boolean);
    var out = ['Not Due'], lo = 0;
    bounds.forEach(function (b) { out.push((lo === 0 ? 0 : lo + 1) + '-' + b); lo = b; });
    out.push(lo + '+');
    return out;
  }

  /**
   * Bill-wise position for all debtor (kind='receivable') or creditor ('payable') ledgers.
   * Explicit bill allocations are used first; vouchers without allocations become synthetic bills;
   * any remaining difference to the ledger balance is applied FIFO (BILL_ALLOCATION_FALLBACK) or
   * shown as On Account. The total ALWAYS ties to the ledger balance.
   */
  function outstanding(ctx, p) {
    p = p || {};
    var kind = p.kind === 'payable' ? 'payable' : 'receivable';
    var asOf = D(p.asOf) || ctx.today;
    var sign = kind === 'receivable' ? 1 : -1;      // converts nd into "amount owed" in natural direction
    var isParty = kind === 'receivable' ? function (i) { return i.isDebtor; } : function (i) { return i.isCreditor; };
    var bills = {}, parties = {};
    function party(name) { return parties[key(name)] = parties[key(name)] || { party: ctx.ledgerInfo(name).name, bills: [] }; }
    function billKey(pn, bn) { return key(pn) + '|' + key(bn); }
    function defaultDue(pn, date, creditDays) {
      var cd = creditDays !== null && creditDays !== undefined ? creditDays : ctx.ledgerInfo(pn).creditDays;
      if (cd === null || cd === undefined) cd = ctx.S.DEFAULT_CREDIT_DAYS;
      return addDays(date, cd);
    }
    function newBill(pn, name, date, due, v) {
      var k = billKey(pn, name);
      if (!bills[k]) {
        bills[k] = { party: ctx.ledgerInfo(pn).name, bill_name: name, bill_date: date, due_date: due, amount: 0, settled: 0, voucher_id: v ? v.id : '', voucher_number: v ? v.number : '', settlements: [], synthetic: false };
        party(pn).bills.push(bills[k]);
      }
      return bills[k];
    }

    ctx.vouchers.forEach(function (v) {
      if (v.date > asOf) return;
      var partyLines = v.lines.filter(function (l) { return isParty(l.info); });
      if (!partyLines.length) return;
      var explicit = v.bills.filter(function (b) { return isParty(ctx.ledgerInfo(b.party)); });
      var covered = {};
      explicit.forEach(function (b) {
        covered[key(b.party)] = r2((covered[key(b.party)] || 0) + b.nd);
        var amt = r2(b.nd * sign);
        if (b.type === 'Agst Ref') {
          var bill = bills[billKey(b.party, b.name)] || newBill(b.party, b.name, b.date, b.due || b.date, null);
          bill.settled = r2(bill.settled - amt);
          bill.settlements.push({ date: v.date, amount: -amt, voucher_number: v.number });
        } else if (b.type === 'On Account') {
          party(b.party).onAccount = r2((party(b.party).onAccount || 0) + amt);
        } else { // New Ref / Advance
          var nb = newBill(b.party, b.name, b.date, b.due || defaultDue(b.party, b.date, b.creditDays), v);
          nb.amount = r2(nb.amount + amt);
          if (b.type === 'Advance') nb.advance = true;
        }
      });
      // Party lines not covered by explicit allocations -> synthetic bill (debit side for receivables, credit side for payables)
      var perParty = groupBy(partyLines, function (l) { return key(l.ledger); });
      Object.keys(perParty).forEach(function (pk) {
        var lnd = sum(perParty[pk], function (l) { return l.nd; });
        var rest = r2(lnd - (covered[pk] || 0));
        if (!rest) return;
        var pn = perParty[pk][0].ledger;
        if (rest * sign > 0) {
          var sb = newBill(pn, v.number || v.id, v.date, defaultDue(pn, v.date, null), v);
          sb.amount = r2(sb.amount + rest * sign); sb.synthetic = true;
        } else {
          var pr = party(pn);
          pr.unallocated = r2((pr.unallocated || 0) + rest * sign);
          (pr.credits = pr.credits || []).push({ date: v.date, amount: -rest * sign, voucher_number: v.number });
        }
      });
    });

    // Opening balances (master) -> synthetic opening bill or unallocated credit
    ledgerNames(ctx, isParty).forEach(function (n) {
      var info = ctx.ledgerInfo(n), ob = r2(info.openingNd * sign);
      if (!ob) return;
      if (ob > 0) {
        var b = newBill(n, 'Opening Balance', ctx.booksBegin, ctx.booksBegin, null);
        b.amount = r2(b.amount + ob); b.synthetic = true;
      } else {
        var pr = party(n); pr.unallocated = r2((pr.unallocated || 0) + ob);
        (pr.credits = pr.credits || []).unshift({ date: ctx.booksBegin, amount: -ob, voucher_number: 'Opening' });
      }
    });

    var fifo = str(ctx.S.BILL_ALLOCATION_FALLBACK).toUpperCase() === 'FIFO';
    var allBills = [], partyRows = [], labels = bucketLabels(ctx), bucketTotals = {};
    labels.forEach(function (b) { bucketTotals[b] = 0; });

    Object.keys(parties).forEach(function (pk) {
      var pr = parties[pk];
      var credit = r2(-(pr.unallocated || 0) - (pr.onAccount || 0)); // unapplied money in favour of the party's debt
      // Settlements against bills we never saw raised (e.g. bills inside an opening balance) are unapplied credit too.
      var list = sortBy(pr.bills.filter(function (b) {
        if (b.amount === 0 && b.settled > 0) { credit = r2(credit + b.settled); return false; }
        return true;
      }), function (b) { return b.bill_date + '|' + b.bill_name; });
      if (fifo && credit > 0) {
        var credits = (pr.credits || []).slice();
        list.forEach(function (b) {
          var open = r2(b.amount - b.settled);
          if (open <= 0 || credit <= 0) return;
          var apply = Math.min(open, credit);
          b.settled = r2(b.settled + apply); credit = r2(credit - apply);
          b.settlements.push({ date: credits.length ? credits[0].date : asOf, amount: apply, voucher_number: 'FIFO' });
        });
      }
      var ledgerBal = r2(balanceAt(ctx, pr.party, asOf) * sign);
      var billTotal = sum(list, function (b) { return r2(b.amount - b.settled); });
      var onAccount = r2(ledgerBal - billTotal); // what bills don't explain (advances, unallocated debits)
      var rows = [];
      list.forEach(function (b) {
        var out = r2(b.amount - b.settled);
        if (Math.abs(out) < 0.005) return;
        var basis = str(ctx.S.AGEING_BASIS).toUpperCase() === 'BILL_DATE' ? b.bill_date : b.due_date;
        var daysOut = daysBetween(b.bill_date, asOf);
        var overdue = daysBetween(b.due_date, asOf);
        var ageDays = daysBetween(basis, asOf);
        var row = {
          party: b.party, bill_name: b.bill_name, bill_date: b.bill_date, due_date: b.due_date,
          bill_amount: b.amount, settled_amount: b.settled, outstanding: out,
          days_outstanding: daysOut, days_overdue: Math.max(0, overdue),
          ageing_bucket: out < 0 ? 'Advance' : bucketFor(ctx, ageDays),
          status: out < 0 ? 'Advance' : (overdue > 0 ? 'Overdue' : 'Current'),
          voucher_id: b.voucher_id, voucher_number: b.voucher_number, synthetic: b.synthetic
        };
        rows.push(row);
      });
      if (Math.abs(onAccount) >= 0.01) {
        rows.push({
          party: pr.party, bill_name: onAccount < 0 ? 'On Account (advance / unallocated)' : 'Unallocated debit',
          bill_date: asOf, due_date: asOf, bill_amount: onAccount, settled_amount: 0, outstanding: onAccount,
          days_outstanding: 0, days_overdue: 0, ageing_bucket: onAccount < 0 ? 'Advance' : 'Not Due', status: onAccount < 0 ? 'Advance' : 'Current',
          voucher_id: '', voucher_number: '', synthetic: true
        });
      }
      if (!rows.length && !ledgerBal) return;
      rows.forEach(function (r) {
        if (bucketTotals[r.ageing_bucket] !== undefined) bucketTotals[r.ageing_bucket] = r2(bucketTotals[r.ageing_bucket] + r.outstanding);
        else bucketTotals[r.ageing_bucket] = r2((bucketTotals[r.ageing_bucket] || 0) + r.outstanding);
      });
      allBills = allBills.concat(rows);
      var overdueRows = rows.filter(function (r) { return r.status === 'Overdue'; });
      var info = ctx.ledgerInfo(pr.party);
      partyRows.push({
        party: pr.party, gstin: info.gstin, balance: ledgerBal,
        outstanding_bills: rows.filter(function (r) { return r.outstanding > 0; }).length,
        overdue_bills: overdueRows.length, overdue_amount: sum(overdueRows, function (r) { return r.outstanding; }),
        oldest_due: overdueRows.length ? sortBy(overdueRows, function (r) { return r.due_date; })[0].due_date : '',
        max_days_overdue: overdueRows.reduce(function (m, r) { return Math.max(m, r.days_overdue); }, 0),
        buckets: labels.reduce(function (o, l) { o[l] = sum(rows.filter(function (r) { return r.ageing_bucket === l; }), function (r) { return r.outstanding; }); return o; }, {}),
        advance: sum(rows.filter(function (r) { return r.outstanding < 0; }), function (r) { return r.outstanding; })
      });
    });
    partyRows = sortBy(partyRows, function (r) { return r.balance; }, true);
    allBills = sortBy(allBills, function (r) { return r.due_date; });
    var totalOutstanding = sum(partyRows, function (r) { return r.balance; });
    var overdue = sum(allBills.filter(function (r) { return r.status === 'Overdue'; }), function (r) { return r.outstanding; });
    return {
      kind: kind, asOf: asOf, basis: ctx.S.AGEING_BASIS, bucketLabels: labels, bucketTotals: bucketTotals,
      total: totalOutstanding, overdue: overdue, current: r2(totalOutstanding - overdue),
      parties: partyRows, bills: allBills,
      summary: {
        overdue30: sum(allBills.filter(function (r) { return r.days_overdue > 30; }), function (r) { return r.outstanding; }),
        overdue60: sum(allBills.filter(function (r) { return r.days_overdue > 60; }), function (r) { return r.outstanding; }),
        overdue90: sum(allBills.filter(function (r) { return r.days_overdue > 90; }), function (r) { return r.outstanding; }),
        overdue180: sum(allBills.filter(function (r) { return r.days_overdue > 180; }), function (r) { return r.outstanding; }),
        overdue365: sum(allBills.filter(function (r) { return r.days_overdue > 365; }), function (r) { return r.outstanding; })
      }
    };
  }

  /** Customer / vendor account summary: opening, sales/purchases, notes, receipts/payments, adjustments, closing. */
  function partyAccounts(ctx, p) {
    p = p || {};
    var kind = p.kind === 'vendor' ? 'vendor' : 'customer';
    var to = D(p.to) || ctx.today, from = D(p.from) || fyStart(to, ctx.fyM);
    var sign = kind === 'customer' ? 1 : -1;
    var pred = kind === 'customer' ? function (i) { return i.isDebtor; } : function (i) { return i.isCreditor; };
    var os = outstanding(ctx, { kind: kind === 'customer' ? 'receivable' : 'payable', asOf: to });

  // ---------------------------------------------------------------------------

  // ---------------------------------------------------------------------------

        party_ledger: v.party, party_gstin: v.partyGstin || (v.partyInfo ? v.partyInfo.gstin : ''),
        place_of_supply: v.pos || (v.partyInfo ? v.partyInfo.state : ''),

  function gstSummary(ctx, p) {

      return Object.keys(g).map(function (k) { var its = g[k]; return { hsn_sac: k, quantity: sum(its, function (i) { return num(i.qty); }), taxable_value: sum(its, function (i) { return num(i.taxable_amount); }), cgst: sum(its, function (i) { return num(i.cgst); }), sgst: sum(its, function (i) { return num(i.sgst); }), igst: sum(its, function (i) { return num(i.igst); }), cess: sum(its, function (i) { return num(i.cess); }) }; }).sort(function (a, b) { return b.taxable_value - a.taxable_value; });

    };

  // ---------------------------------------------------------------------------
  // Dashboards, MIS, financial health, analytics

  function daySummary(ctx, date) {

  function dashboard(ctx, p) {

Pages.health = { render: function (root) {

  <script>/* js/pages-admin.js */
/* Pages: Tally integration, audit trail, settings. */
var Pages = window.Pages = window.Pages || {};

// =============================================================================

Pages.tally = { render: function (root, q) {

  Api.call('getTallyStatus', {}).then(function (t) {

    var offline = Object.keys(counts).filter(function (k) { return k.indexOf('OFFLINE|') === 0; }).reduce(function (s, k) { return s + counts[k]; }, 0);
    root.innerHTML = Shared.head('Tally Integration', 'Tally → on-premise connector → validation & normalization → Apps Script API → Google Sheets',

      '<div class="kpis">' + UI.kpi('Last successful sync', last ? whenShort(last.end_time) : 'Never', last ? last.mode + ' · ' + (last.records_added || 0) + ' added, ' + (last.records_updated || 0) + ' updated' : '', last ? 'good' : 'bad', last ? fmt.dt(last.end_time) : '') +
      UI.kpi('Connector last seen', t.connectorLastSeen ? whenShort(t.connectorLastSeen) : 'Never', '', '', t.connectorLastSeen ? fmt.dt(t.connectorLastSeen) : '') + UI.kpi('Queued requests', t.pending) + UI.kpi('Unresolved errors', t.unresolvedErrors, '', t.unresolvedErrors ? 'bad' : 'good') +
      UI.kpi('Tally vouchers', fmt.num(tally, 0)) + UI.kpi('Offline vouchers', fmt.num(offline, 0)) + '</div>' +
      '<div class="tabs mt no-print">' + [['status', 'Sync history'], ['errors', 'Errors'], ['config', 'Configuration'], ['raw', 'Raw data']].map(function (x) { return '<button data-t="' + x[0] + '" class="' + (tab === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div><div id="tBody"></div>';
    UI.$$('.tabs [data-t]', root).forEach(function (b) { b.onclick = function () { location.hash = '#/tally?tab=' + b.dataset.t; }; });
    var body = $('#tBody', root);
    function request(p) { return Api.call('requestTallySync', p).then(function (r) { UI.toast(r.message, 'good'); App.route(); }); }
    var sn = $('#syncNow', root);
    if (sn) sn.onclick = function () { sn.disabled = true; request({ mode: 'INCREMENTAL' }).catch(function (e) { UI.toast(e.message, 'bad'); sn.disabled = false; }); };
    var sa = $('#syncAdv', root);
    if (sa) sa.onclick = function () {
      UI.modal({ title: 'Request a Tally sync', okText: 'Queue sync',
        body: '<div class="note" style="margin-bottom:12px">The request is queued; the connector on the Tally PC picks it up on its next poll. Duplicates are never imported - vouchers are keyed by Tally GUID (or company + type + number + date).</div><div class="form-grid">' +
          UI.field('Mode', UI.select('mode', [{ value: 'INCREMENTAL', label: 'Incremental (changes since last AlterID)' }, { value: 'FULL', label: 'Full (also detects deletions)' }, { value: 'DATE_RANGE', label: 'Date range' }, { value: 'VOUCHER', label: 'Voucher type / number' }, { value: 'LEDGER', label: 'Ledger-wise' }, { value: 'MASTERS', label: 'Masters only' }], 'INCREMENTAL'), '', 'full') +
          UI.field('From', '<input class="input" type="date" name="from_date">') + UI.field('To', '<input class="input" type="date" name="to_date">') +
          UI.field('Voucher type', UI.input('voucher_type', '', 'placeholder="e.g. Sales"')) + UI.field('Voucher number', UI.input('voucher_number', '')) + UI.field('Ledger', UI.input('ledger', ''), '', 'full') + '</div>',
        onOk: function (m) { return request(UI.formData(m)); } });
    };
    if (tab === 'status') {
      body.innerHTML = '<div class="card">' + UI.staticTable([{ key: 'sync_id', label: 'Sync' }, { key: 'mode', label: 'Mode' }, { key: 'requested_by', label: 'Requested by' }, { key: 'start_time', label: 'Started', render: function (v) { return esc(fmt.dt(v)); } }, { key: 'end_time', label: 'Finished', render: function (v) { return esc(fmt.dt(v)); } }, { key: 'records_fetched', label: 'Fetched', type: 'num' }, { key: 'records_added', label: 'Added', type: 'num' }, { key: 'records_updated', label: 'Updated', type: 'num' }, { key: 'records_skipped', label: 'Skipped (dup)', type: 'num' }, { key: 'records_failed', label: 'Failed', type: 'num' }, { key: 'status', label: 'Status', type: 'badge' }, { key: 'connector_host', label: 'Connector' }], t.recent, { emptyText: 'No syncs yet. Start the connector on the Tally PC.' }) + '</div>';
    } else if (tab === 'errors') {
      var cols = [{ key: 'created_at', label: 'When', render: function (v) { return esc(fmt.dt(v)); } }, { key: 'sync_id', label: 'Sync' }, { key: 'voucher_number', label: 'Voucher' }, { key: 'severity', label: 'Severity', type: 'badge' }, { key: 'error_code', label: 'Code' }, { key: 'message', label: 'Message' }, { key: '_r', label: '', sortable: false, render: function (v, r) { return Api.can('run.sync') && !r.resolved ? '<button class="btn sm" data-res="' + esc(r.error_id) + '">Mark resolved</button>' : ''; } }];
      body.innerHTML = '<div class="note">Rejected vouchers are never half-posted. Fix the voucher in Tally (for example, an unbalanced journal) and the next sync imports it.</div><div class="card mt" id="teT"></div>';
      var tbl = UI.table($('#teT', body), { columns: cols, load: function (p) { return Api.call('getTallyErrors', p); }, afterRender: function (c) { UI.$$('[data-res]', c).forEach(function (b) { b.onclick = function () { Api.call('resolveTallyError', { error_id: b.dataset.res }).then(function () { tbl.reload(); App.refreshIndicators(); }); }; }); } });
    } else if (tab === 'config') {
      var cfg = t.config || {};
      body.innerHTML = '<div class="grid g2"><div class="card"><div class="card-head"><h3>Connection (non-secret)</h3>' + (Api.can('admin.settings') ? '<a class="btn sm" href="#/settings">Edit in Settings</a>' : '') + '</div><div class="card-body">' +
        (Object.keys(cfg).length ? Object.keys(cfg).map(function (k) { return '<div class="stat-line"><span class="muted">' + esc(k) + '</span><b>' + esc(cfg[k]) + '</b></div>'; }).join('') : UI.empty('No TALLY/SYNC keys in CONFIG yet.')) +
        '</div></div><div class="card"><div class="card-head"><h3>How it connects</h3></div><div class="card-body small">' +
        '<ol style="padding-left:18px;margin:0;line-height:1.8"><li>In Tally: F1 Help → Settings → Connectivity → enable the XML server on port 9000 and keep the company open.</li><li>On the Tally PC install Python 3.9+ and copy <code>backend/python</code>.</li><li>In the Sheet: Accounts Dashboard menu → Generate connector API key; set it as the <code>ACCOUNTS_CONNECTOR_API_KEY</code> environment variable on the Tally PC.</li><li>Configure <code>config.ini</code> (Tally URL, company, Apps Script URL) and run <code>python -m tally_connector test-connection</code>.</li><li>Schedule <code>python -m tally_connector watch</code> (Task Scheduler) for automatic incremental sync and to pick up "Sync now" requests.</li></ol>' +
        '<p class="muted">Credentials and the API key never reach this web app.</p></div></div></div>';
    } else {
      body.innerHTML = '<form class="filters" id="rawF">' + UI.field('Voucher ID', UI.input('voucher_id', '', 'placeholder="VCH-000123"')) + '<div class="field"><label>&nbsp;</label><button class="btn primary" type="submit">Show payload</button></div></form><div id="rawOut" class="card"><div class="empty">Enter a voucher ID (open any voucher to see it) to view the original Tally XML preserved in TALLY_RAW_DATA.</div></div>';
      $('#rawF', body).addEventListener('submit', function (e) {
        e.preventDefault();
        Api.call('getTallyData', UI.formData(e.target)).then(function (r) {
          $('#rawOut', body).innerHTML = r.xml ? '<div class="card-body">' + (r.note ? '<div class="note">' + esc(r.note) + '</div>' : '') + '<div class="small muted">Key ' + esc(r.unique_key) + ' · AlterID ' + esc(r.alter_id) + ' · revisions ' + esc(r.revisions) + '</div><pre style="white-space:pre-wrap;font-size:12px">' + esc(r.xml) + '</pre></div>' : UI.empty('No raw payload for that voucher.');
        }, function (e2) { $('#rawOut', body).innerHTML = UI.errorBox(e2); });
      });
    }
  }, function (e) { root.innerHTML = UI.errorBox(e); });
} };

Pages.audit = { render: function (root) {

// Settings: accounting rules, configuration, users & roles
// =============================================================================
Pages.settings = { render: function (root, q) {
  var esc = UI.esc, $ = UI.$;
  var tab = q.tab || 'rules';
  var DESCRIPTIONS = {
    FY_START_MONTH: 'Financial year start month (4 = April, Indian FY).', AGEING_BASIS: 'DUE_DATE or BILL_DATE.', AGEING_BUCKETS: 'Upper bounds of ageing buckets in days.',
    DEFAULT_CREDIT_DAYS: 'Credit period when neither bill nor ledger defines one.', BILL_ALLOCATION_FALLBACK: 'FIFO applies receipts/payments without bill references to the oldest bills; NONE leaves them on account.',
    STOCK_VALUATION_SOURCE: 'INVENTORY (valuations sheet, falls back to stock ledgers), LEDGER or NONE.', INCLUDE_OPTIONAL_VOUCHERS: 'Include Tally optional (memorandum) vouchers.',
    BANK_OD_AS_CASH_EQUIVALENT: 'Treat Bank OD as cash in cash-flow.', INTEREST_PAID_ACTIVITY: 'Financing or Operating (Ind AS 7 permits either).', EBITDA_INCLUDES_OTHER_INCOME: 'Include other income in EBITDA.',
    DSO_USE_GROSS_SALES: 'Use GST-inclusive sales for receivable days.', ROUND_INVOICE_TOTAL: 'Round offline invoice totals to the rupee.', PAYMENT_MODE_LEDGERS: 'JSON map of payment mode → cash/bank ledger for offline sales.',
    COMPANY_STATE: 'Decides CGST+SGST vs IGST.', MSME_MAX_PAYMENT_DAYS: 'MSME payment limit (Sec. 43B(h)).', CASH_SHORTAGE_THRESHOLD: 'Alert when cash & bank fall below this.', HIGH_EXPENSE_INCREASE_PCT: 'Alert when month-to-date expenses rise more than this % over last month.'
  };
  root.innerHTML = Shared.head('Settings', 'Accounting rules, connection configuration, users and roles') +
    '<div class="tabs no-print">' + [['rules', 'Accounting rules'], ['config', 'Configuration'], ['users', 'Users & roles']].map(function (x) { return '<button data-t="' + x[0] + '" class="' + (tab === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div><div id="sBody">' + UI.loading() + '</div>';
  UI.$$('.tabs [data-t]', root).forEach(function (b) { b.onclick = function () { location.hash = '#/settings?tab=' + b.dataset.t; }; });
  var body = $('#sBody', root);
  if (tab === 'users') {
    Api.call('getUsers', {}).then(function (users) {
      var roles = Object.keys(App.ROLE_LABELS);
      var matrix = [['View dashboards', 'view.dashboard'], ['View accounts & registers', 'view.accounts'], ['View financial reports', 'view.reports'], ['Post transactions', 'write.transactions'], ['Offline sales entry', 'write.offline_sales'], ['Create ledgers', 'write.masters'], ['Submit expenses', 'submit.expenses'], ['Approve expenses', 'approve.expenses'], ['Run Tally sync', 'run.sync'], ['Bank reconciliation', 'reconcile.bank'], ['Audit trail', 'view.audit'], ['Settings & users', 'admin.settings']];
      var P = { ADMIN: ['*'], ACCOUNTANT: ['view.dashboard', 'view.accounts', 'view.reports', 'write.transactions', 'write.masters', 'write.offline_sales', 'submit.expenses', 'run.sync', 'reconcile.bank'], FINANCE_MANAGER: ['view.dashboard', 'view.accounts', 'view.reports', 'view.audit', 'approve.expenses', 'submit.expenses', 'run.sync', 'reconcile.bank'], MANAGEMENT: ['view.dashboard', 'view.accounts', 'view.reports'], DATA_ENTRY: ['write.offline_sales', 'write.transactions', 'submit.expenses'], AUDITOR: ['view.dashboard', 'view.accounts', 'view.reports', 'view.audit'] };
      body.innerHTML = '<div class="card"><div class="card-head"><h3>Users</h3>' + (Api.can('admin.users') ? '<button class="btn primary sm" id="addU">' + UI.icon('plus') + 'Add user</button>' : '') + '</div>' +
        UI.staticTable([{ key: 'full_name', label: 'Name' }, { key: 'email', label: 'Email' }, { key: 'role', label: 'Role', render: function (v) { return esc(App.ROLE_LABELS[v] || v); } }, { key: 'status', label: 'Status', type: 'badge' }, { key: 'last_login', label: 'Last login' }], users) + '</div>' +
        '<div class="card mt"><div class="card-head"><h3>Role permissions</h3><span class="sub">Enforced by the API; navigation hides what a role cannot use</span></div>' +
        UI.staticTable([{ key: 'l', label: 'Permission' }].concat(roles.map(function (r) { return { key: r, label: App.ROLE_LABELS[r], render: function (v) { return v ? UI.icon('check') : ''; } }; })), matrix.map(function (m) { var o = { l: m[0] }; roles.forEach(function (r) { o[r] = P[r].indexOf('*') >= 0 || P[r].indexOf(m[1]) >= 0; }); return o; })) + '</div>';
      var au = $('#addU', body);

    }
  }, function (e) { body.innerHTML = UI.errorBox(e); });
} };
